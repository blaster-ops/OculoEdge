name: Offline pipeline
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -r requirements-ml.txt
      - run: python -m unittest discover -s tests -v
      - run: python run.py --check
      - run: python -m benchmarks.evaluate_metrics --output output/ci-benchmark
